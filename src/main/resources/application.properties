server.port=8581
spring.application.name=ai-news-agent

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Gmail digest email (SMTP, app password stored in macOS Keychain)
gmail.enabled=true
gmail.recipient=jaiswal.raj9@gmail.com
gmail.sender-name=AI News Agent
gmail.username=jaiswal.raj9@gmail.com
gmail.keychain-service=ai-news-agent-gmail
gmail.smtp-host=smtp.gmail.com
gmail.smtp-port=587
